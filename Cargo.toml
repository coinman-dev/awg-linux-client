[package]
name = "awg-gui"
version = "0.1.0-beta"
edition = "2024"
rust-version = "1.95"
description = "AmneziaWG VPN client with a graphical interface for Linux"
license = "GPL-2.0-or-later"
repository = "https://github.com/coinman-dev/awg-linux-client"
keywords = ["vpn", "wireguard", "amneziawg", "gui", "linux"]
categories = ["network-programming", "gui"]

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.11"
getrandom = "0.4.3"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
